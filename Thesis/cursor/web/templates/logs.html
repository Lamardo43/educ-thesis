{% extends "base.html" %}

{% block title %}Журналы процессов — MockControl{% endblock %}

{% block page_title %}Журналы процессов{% endblock %}

{% block content %}
<div
  class="logs-page"
  data-page="logs"
  data-api-logs-base="/api/v1/logs"
  data-api-mocks-base="/api/v1/mocks"
  data-poll-interval-ms="2000"
  data-default-lines="1000"
>
  <div class="logs-toolbar">
    <label class="sr-only" for="log-mock-select">Сервис</label>
    <select id="log-mock-select" class="select" name="mock" aria-label="Выбор сервиса">
      {% if mocks %}
      <option value="" disabled selected>Выберите сервис…</option>
      {% for mock in mocks %}
      <option value="{{ mock.filename | e }}">{{ mock.filename | e }}</option>
      {% endfor %}
      {% else %}
      <option value="" disabled selected>Нет зарегистрированных сервисов</option>
      {% endif %}
    </select>

    <div
      class="logs-toolbar__auto"
      style="display: inline-flex; align-items: center; gap: 10px"
    >
      <label
        class="toggle"
        title="Автообновление каждые 2 с"
        aria-label="Автообновление журнала"
      >
        <input type="checkbox" id="log-auto-refresh" />
        <span class="toggle__track"><span class="toggle__thumb"></span></span>
      </label>
      <span style="font-size: 0.875rem; color: var(--text-secondary)">Авто</span>
    </div>

    <div
      class="logs-toolbar__actions"
      style="margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px"
    >
      <button type="button" class="btn btn--ghost" id="log-btn-refresh">Обновить</button>
      <button type="button" class="btn btn--ghost" id="log-btn-clear">Очистить</button>
    </div>
  </div>

  <div class="logs-statusbar" role="status" aria-live="polite">
    <div class="logs-statusbar__left">
      <span class="logs-statusbar__dot" aria-hidden="true">●</span>
      <span id="log-status-main">—</span>
    </div>
    <div class="logs-statusbar__meta">
      Строк в буфере: <span id="log-line-count">0</span>
    </div>
  </div>

  <div id="log-terminal" class="terminal" aria-label="Вывод журнала процесса"></div>
</div>
{% endblock %}
