<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{% block title %}MockControl{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="/static/css/custom.css"/>
</head>
<body>

<div class="d-flex" style="min-height:100vh;">

  <!-- ── Sidebar ──────────────────────────────────────────────────────── -->
  <nav class="sidebar d-flex flex-column flex-shrink-0 p-3">
    <a href="/" class="sidebar-brand d-flex align-items-center gap-2 mb-4 text-decoration-none">
      <i class="bi bi-hdd-network-fill fs-4 text-primary"></i>
      <span class="fw-bold fs-5">MockControl</span>
    </a>
    <ul class="nav nav-pills flex-column mb-auto gap-1">
      <li class="nav-item">
        <a href="/" class="nav-link {% if request.url.path == '/' %}active{% endif %}">
          <i class="bi bi-speedometer2 me-2"></i>Dashboard
        </a>
      </li>
      <li class="nav-item">
        <a href="/settings" class="nav-link {% if request.url.path == '/settings' %}active{% endif %}">
          <i class="bi bi-gear me-2"></i>Настройки
        </a>
      </li>
      <li class="nav-item">
        <a href="/logs" class="nav-link {% if request.url.path == '/logs' %}active{% endif %}">
          <i class="bi bi-terminal me-2"></i>Журналы
        </a>
      </li>
    </ul>
    <div class="mt-auto sidebar-footer text-muted small">v1.0.0</div>
  </nav>

  <!-- ── Main content ─────────────────────────────────────────────────── -->
  <div class="flex-grow-1 d-flex flex-column">

    <!-- Header -->
    <header class="main-header d-flex align-items-center justify-content-between px-4">
      <h6 class="mb-0 fw-semibold">{% block page_title %}{% endblock %}</h6>
      <div class="d-flex align-items-center gap-2">
        {% if redis_ok %}
          <span class="badge bg-success-subtle text-success-emphasis">
            <i class="bi bi-circle-fill me-1" style="font-size:.55rem;"></i>Redis: подключён
          </span>
        {% else %}
          <span class="badge bg-danger-subtle text-danger-emphasis">
            <i class="bi bi-circle-fill me-1" style="font-size:.55rem;"></i>Redis: недоступен
          </span>
        {% endif %}
      </div>
    </header>

    <!-- Page content -->
    <main class="flex-grow-1 p-4">
      {% block content %}{% endblock %}
    </main>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
