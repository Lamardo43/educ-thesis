{% extends "base.html" %}
{% block title %}Журналы — MockControl{% endblock %}
{% block page_title %}Журналы процессов{% endblock %}

{% block content %}
<div class="card border-0">
  <div class="card-header border-secondary">
    <div class="d-flex align-items-center gap-3 flex-wrap">
      <select class="form-select form-select-sm w-auto" id="mockSelect">
        <option value="">Выберите заглушку...</option>
        {% for mock in mocks %}
        <option value="{{ mock.filename }}">
          {{ mock.filename }}
          {% if mock.status.value == 'RUNNING' %} ▶{% endif %}
        </option>
        {% endfor %}
      </select>
      <div class="form-check form-switch mb-0">
        <input class="form-check-input" type="checkbox" id="autoRefresh" checked/>
        <label class="form-check-label small" for="autoRefresh">Авто</label>
      </div>
      <button class="btn btn-sm btn-outline-secondary" id="refreshBtn">
        <i class="bi bi-arrow-clockwise me-1"></i>Обновить
      </button>
      <button class="btn btn-sm btn-outline-danger" id="clearBtn">
        <i class="bi bi-x-circle me-1"></i>Очистить
      </button>
      <span id="processInfo" class="ms-auto small text-muted"></span>
    </div>
  </div>
  <div class="card-body p-0">
    <div id="logContainer" class="log-container">
      <span class="text-muted">Выберите заглушку для просмотра журнала...</span>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/logs.js"></script>
{% endblock %}
